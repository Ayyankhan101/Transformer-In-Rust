[package]
name = "rust_transformer"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75.0"

[[bench]]
name = "transformer"
harness = false

[[example]]
name = "convert_codegen_to_safetensors"
path = "examples/convert_codegen_to_safetensors.rs"

[features]
default = []
server = ["dep:axum", "dep:tokio"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
anyhow = "1.0"
safetensors = "0.8.0"
serde_json = "1.0"
ureq = { version = "3", features = ["json"] }
gemm = { version = "0.17", features = ["f16"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rand = "0.9"
rand_distr = "0.5"
bytemuck = "1.25.2"
half = "2.7"
clap = { version = "4.6.4", features = ["derive"] }
axum = { version = "0.8", features = ["json"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"], optional = true }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.8"
