[package]
name = "rust_transformer"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = "0.8.0"
candle-nn = "0.8.0"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
anyhow = "1.0"
safetensors = "0.4.3"
serde_json = "1.0"
ureq = { version = "3", features = ["json"] }
gemm = { version = "0.17", features = ["f16"] }
