name: Benchmarks

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run benchmarks (short sample)
        run: cargo bench --bench transformer -- --warm-up-time 1 --measurement-time 1 --sample-size 10

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 30

      - name: Post benchmark results (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let body = '## Benchmark Results\n\n';
            body += '| Benchmark | Time | Change |\n';
            body += '|:----------|:-----|:-------|\n';

            const criterionDir = 'target/criterion';
            if (fs.existsSync(criterionDir)) {
              const groups = fs.readdirSync(criterionDir);
              for (const group of groups) {
                const reportPath = path.join(criterionDir, group, 'new', 'estimates.json');
                if (fs.existsSync(reportPath)) {
                  const estimates = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
                  const mean = estimates.mean.point_estimate / 1e6; // ns to ms
                  body += `| ${group} | ${mean.toFixed(2)} ms | new baseline |\n`;
                }
              }
            }

            body += '\n*Full report uploaded as artifact.*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
